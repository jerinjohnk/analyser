[package]
name = "commitscape"
version = "1.0.0"
authors = ["Jerin John K", "Arpad Ray"]
edition = "2021"
description = "Turn a local Git repository's history into poster-style SVG visualizations, entirely offline"
license = "AGPL-3.0-only"

[[bin]]
name = "commitscape"
path = "src/main.rs"

[dependencies]
chrono = "0.4.26"
pbr = "1.1.1"
dialoguer = "0.10.4"
anyhow = "1.0.72"
thiserror = "1.0.44"
git2 = { version = "0.17.2", default-features = false, optional = true }
log = "0.4.19"
env_logger = "0.10.0"
regex = { version = "1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subprocess = { version = "^0.2.9", optional = true }
clap = { version = "4.3.19", features = ["derive"] }

[features]
default = ["git"]
git = ["subprocess"]
git-libgit2 = ["git2"]

[profile.release]
lto = "fat"
debug = 0
panic = "abort"
opt-level = "z"
codegen-units = 1
