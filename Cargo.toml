[package]
name = "commitscape"
version = "1.0.0"
authors = ["Jerin John K", "Arpad Ray"]
edition = "2024"
rust-version = "1.88"
description = "Turn a local Git repository's history into poster-style SVG visualizations, entirely offline"
license = "AGPL-3.0-only"

[[bin]]
name = "commitscape"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.10", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
env_logger = { version = "0.11.12", default-features = false, features = ["auto-color", "humantime"] }
git2 = { version = "0.21.0", default-features = false, optional = true }
indicatif = "0.18.6"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[features]
default = ["git"]
git = []
git-libgit2 = ["dep:git2"]

[profile.release]
lto = "fat"
debug = 0
panic = "abort"
opt-level = "z"
codegen-units = 1
